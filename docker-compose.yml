services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-crime_evidence_db}
      DB_NAME: ${MONGO_DB_NAME:-crime_evidence_db}
      MONGO_SERVER_SELECTION_TIMEOUT_MS: ${MONGO_SERVER_SELECTION_TIMEOUT_MS:-1000}
      MONGO_SOCKET_TIMEOUT_MS: ${MONGO_SOCKET_TIMEOUT_MS:-10000}
      MONGO_RECONNECT_INTERVAL_SECONDS: ${MONGO_RECONNECT_INTERVAL_SECONDS:-5}
      SECRET_KEY: ${SECRET_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      UPLOAD_FOLDER: /app/backend/uploads
      YOLO_MODEL_PATH: /app/backend/models/best.pt
      CNN_MODEL_PATH: /app/backend/models/best_cnn.pth
      VIDEO_MODEL_PATH: /app/backend/models/video_classifier.pth
      TEMPORAL_EVENT_WEIGHTS: ${TEMPORAL_EVENT_WEIGHTS:-}
      TEMPORAL_EVENT_BIN_SEC: ${TEMPORAL_EVENT_BIN_SEC:-1.0}
      TEMPORAL_EVENT_MIN_SCORE: ${TEMPORAL_EVENT_MIN_SCORE:-0.55}
      TEMPORAL_EVENT_MIN_CLASSIFIER_PROBABILITY: ${TEMPORAL_EVENT_MIN_CLASSIFIER_PROBABILITY:-0.5}
      TEMPORAL_EVENT_MIN_SUPPORTED_BINS: ${TEMPORAL_EVENT_MIN_SUPPORTED_BINS:-1}
      TEMPORAL_EVENT_MAX_TRACK_GAP_SEC: ${TEMPORAL_EVENT_MAX_TRACK_GAP_SEC:-2.0}
      TEMPORAL_EVENT_BOUNDARY_TOLERANCE_SEC: ${TEMPORAL_EVENT_BOUNDARY_TOLERANCE_SEC:-0.0}
      TEMPORAL_EVENT_YOLO_PERSISTENCE_OBSERVATIONS: ${TEMPORAL_EVENT_YOLO_PERSISTENCE_OBSERVATIONS:-2}
      CLASS_NAMES_PATH: /app/backend/models/class_names.json
      ANOMALY_MODEL_PATH: /app/backend/models/bigru_mil_best.pt
      EVIDENCE_SOURCE_DIR: /data/source-videos
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_HEALTH_TIMEOUT: ${OLLAMA_HEALTH_TIMEOUT:-4}
      OLLAMA_CHAT_TIMEOUT: ${OLLAMA_CHAT_TIMEOUT:-120}
      ASSAULT_RESULTS_DIR: /app/backend/tracked_results_400/Assault
      ASSAULT_TRACKING_STATUS_PATH: /app/backend/tracked_results_400/Assault/tracking_status.csv
      ROBBERY_RESULTS_DIR: /app/backend/tracked_results_400/Robbery
      ROBBERY_TRACKING_STATUS_PATH: /app/backend/tracked_results_400/Robbery/tracking_status.csv
      SHOOTING_RESULTS_DIR: /app/backend/tracked_results_shooting_import/main_archive/Shooting/detections
      SHOOTING_TRACKING_STATUS_PATH: /app/backend/tracked_results_shooting_import/main_archive/Shooting/shooting_tracking_status.csv
      NORMAL_RESULTS_DIR: /app/backend/tracked_results_400/Normal
      ASSAULT_LEGACY_JSON_PATH: /app/backend/assault_77_video_detections.json
    volumes:
      - backend_uploads:/app/backend/uploads
      - ${SOURCE_DATASET_PATH:?Set SOURCE_DATASET_PATH to the existing host dataset folder}:/data/source-videos:ro
      - ./backend/tracked_results_400:/app/backend/tracked_results_400:ro
      - ./backend/tracked_results_shooting_import:/app/backend/tracked_results_shooting_import:ro
      - ./backend/assault_77_video_detections.json:/app/backend/assault_77_video_detections.json:ro
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/dashboard/health', timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 4
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:5000
      VITE_API_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

volumes:
  mongo_data:
  backend_uploads:
